<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Fenêtre et indicateur largeur/hauteur</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    #taille {
      font-weight: bold;
      margin-bottom: 10px;
    }
    .indicateur-container {
      width: 300px;
      height: 20px;
      border: 1px solid #000;
      background-color: #ccc;
      margin-bottom: 5px;
    }
    .barre {
      height: 100%;
      width: 0%;
      background-color: red;
    }
    .label {
      margin-bottom: 2px;
      font-weight: bold;
    }
    #btnOuvrir {
      font-size: 18px;
      padding: 10px 20px;
      margin: 15px 0;
      cursor: pointer;
      background-color: #2d7dfa;
      color: white;
      border: none;
      border-radius: 6px;
    }
    #btnOuvrir:hover {
      background-color: #1a5fd0;
    }
  </style>
</head>
<body>
  <h1>=> Cliquez sur le bouton pour ouvrir les onglets</h1>

  <button id="btnOuvrir">Ouvrir les onglets</button>

  <p id="taille"></p>
  <div class="label">Largeur :</div>
  <div class="indicateur-container"><div id="barreLargeur" class="barre"></div></div>
  <div class="label">Hauteur :</div>
  <div class="indicateur-container"><div id="barreHauteur" class="barre"></div></div>
  <p>Vert : très proche de la cible, jaune : moyen, rouge : loin</p>

  <script>
    const largeurCible = 900;
    const hauteurCible = 400;

    function couleurBarre(ecart, seuils = [50, 150]) {
      const absEcart = Math.abs(ecart);
      if (absEcart <= seuils[0]) return "green";
      if (absEcart <= seuils[1]) return "yellow";
      return "red";
    }

    function afficherTaille() {
      const largeur = window.innerWidth;
      const hauteur = window.innerHeight;

      document.getElementById('taille').textContent =
        `Taille de la fenêtre : ${largeur} x ${hauteur}`;

      const ratioLargeur = Math.min(largeur / largeurCible, 1) * 100;
      const ratioHauteur = Math.min(hauteur / hauteurCible, 1) * 100;

      const barreL = document.getElementById('barreLargeur');
      barreL.style.width = ratioLargeur + "%";
      barreL.style.backgroundColor = couleurBarre(largeur - largeurCible);

      const barreH = document.getElementById('barreHauteur');
      barreH.style.width = ratioHauteur + "%";
      barreH.style.backgroundColor = couleurBarre(hauteur - hauteurCible);
    }

    window.addEventListener('load', afficherTaille);
    window.addEventListener('resize', afficherTaille);

    // Fonctions pour ouvrir les onglets
    function ouvrirOnglet_PB(code, name) {
      const url = "https://preply.com/fr/manage-single-lessons/" + code + "?requestPage=HOME";
      window.open(url, name, "width=200,height=200,resizable=yes,scrollbars=yes");
    }

    function ouvrirOnglet(code, name) {
      var url = "https://preply.com/fr/manage-single-lessons/" + code + "?requestPage=HOME";
      window.open(url, name);
    }

    function ouvrirOnglets() {
      ouvrirOnglet(5553194, 'CHI');
      //ouvrirOnglet(6338431, 'MAI');
      ouvrirOnglet(8744778, 'YEN');
      //ouvrirOnglet(6338483, 'HUONG');
      ouvrirOnglet(7015356, 'THU');
      //ouvrirOnglet(7044522, 'XUAN');
      ouvrirOnglet(7434921, 'TRANG');
      //HO!HO!ouvrirOnglet(37166876, 'THUY');
      ouvrirOnglet(9298883, 'THUY');
    }

    // Déclenchement uniquement au clic (nécessaire pour éviter le blocage
    // des popups par le navigateur sur un site hébergé, ex. GitHub Pages)
    document.getElementById('btnOuvrir').addEventListener('click', ouvrirOnglets);
  </script>
</body>
</html>
